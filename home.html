<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroMart - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">⚡ ElectroMart</div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Welcome to ElectroMart</h1>
    <p>Your one-stop electronics store with amazing gadgets.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <!-- Products -->
  <section id="products" class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="card">
        <img src="images/laptop.jpg" alt="Laptop">
        <h3>Laptop</h3>
        <p>₹55,000</p>
        <button onclick="addToCart('Laptop')">Add to Cart</button>
      </div>
      <div class="card">
        <img src="images/phone.jpg" alt="Smartphone">
        <h3>Smartphone</h3>
        <p>₹25,000</p>
        <button onclick="addToCart('Smartphone')">Add to Cart</button>
      </div>
      <div class="card">
        <img src="images/headphones.jpg" alt="Headphones">
        <h3>Headphones</h3>
        <p>₹2,500</p>
        <button onclick="addToCart('Headphones')">Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 ElectroMart. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
